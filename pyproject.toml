[project]
name = "blisspoint"
version = "0.1.0"
description = "A prompt compiler: one task, shaped correctly for whichever agent receives it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
bliss = "blisspoint.cli:main"

[project.urls]
Homepage = "https://github.com/Operator-create/bliss-point"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["blisspoint"]

[tool.setuptools.package-data]
blisspoint = ["../../profiles/*.yaml", "../../templates/*.md"]
